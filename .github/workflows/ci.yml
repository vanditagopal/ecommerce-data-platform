name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests
      - name: Check test formatting
        run: ruff format --check tests/e2e/test_dashboard.py tests/test_orders_api.py tests/test_orders_pipeline.py
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Browser end-to-end tests
        run: |
          mkdir -p test-results
          python -m pytest -m e2e tests/e2e -q --junitxml=test-results/e2e-junit.xml
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results/e2e-junit.xml
          if-no-files-found: ignore